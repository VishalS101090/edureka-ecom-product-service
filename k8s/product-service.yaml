apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: vishal101090/product-service:latest
          imagePullPolicy: Always
          env:
            - name: SERVER_PORT
              value: "5003"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:5001/eureka/"
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://mongodb-service:27017/product-db"
          ports:
            - containerPort: 5003
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 5003
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 5003
            initialDelaySeconds: 40
            periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 5003
      targetPort: 5003

---

