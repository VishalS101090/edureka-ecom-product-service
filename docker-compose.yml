version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: product-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=product-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    name: product-mongo-data
